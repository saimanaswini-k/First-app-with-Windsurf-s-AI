<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #4ecca3;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        #gameCanvas {
            border: 3px solid #4ecca3;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
            margin: 20px;
        }

        #score {
            font-size: 28px;
            color: #4ecca3;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        #controls {
            margin-top: 20px;
            text-align: center;
        }

        .button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .button:hover {
            background: #45b393;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.4);
        }

        #gameOver {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #4ecca3;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
            z-index: 1000;
        }

        #gameOver h2 {
            color: #4ecca3;
            margin-bottom: 20px;
        }

        .instructions {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }

        .key-control {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
            margin: 0 5px;
            color: #4ecca3;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Snake Game</h1>
        <div id="score">Score: 0</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="controls">
            <button class="button" onclick="startGame()">Start New Game</button>
        </div>
        <div class="instructions">
            Use <span class="key-control">←</span> <span class="key-control">↑</span> <span class="key-control">↓</span> <span class="key-control">→</span> to control the snake
        </div>
    </div>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <p id="finalScore">Your Score: 0</p>
        <button class="button" onclick="startGame()">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [];
        let food = {};
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let gameLoop;
        
        function startGame() {
            // Hide game over screen
            document.getElementById('gameOver').style.display = 'none';
            
            // Initialize snake
            snake = [{x: 200, y: 200}];
            score = 0;
            dx = gridSize;
            dy = 0;
            document.getElementById('score').textContent = 'Score: ' + score;
            
            // Generate initial food
            generateFood();
            
            // Clear any existing game loop
            if (gameLoop) clearInterval(gameLoop);
            
            // Start game loop
            gameLoop = setInterval(draw, 100);
        }
        
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount) * gridSize,
                y: Math.floor(Math.random() * tileCount) * gridSize
            };
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(78, 204, 163, 0.1)';
            for(let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // Move snake
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            // Check if snake ate food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = 'Score: ' + score;
                generateFood();
            } else {
                snake.pop();
            }
            
            // Draw food with glow effect
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff4444';
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Draw snake with gradient effect
            snake.forEach((segment, index) => {
                const gradient = ctx.createLinearGradient(
                    segment.x, segment.y,
                    segment.x + gridSize, segment.y + gridSize
                );
                gradient.addColorStop(0, '#4ecca3');
                gradient.addColorStop(1, '#45b393');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(segment.x, segment.y, gridSize-2, gridSize-2);
                
                // Draw eyes on head
                if(index === 0) {
                    ctx.fillStyle = '#1a1a2e';
                    if(dx > 0) {
                        ctx.fillRect(segment.x + gridSize-8, segment.y + 4, 4, 4);
                        ctx.fillRect(segment.x + gridSize-8, segment.y + gridSize-8, 4, 4);
                    } else if(dx < 0) {
                        ctx.fillRect(segment.x + 4, segment.y + 4, 4, 4);
                        ctx.fillRect(segment.x + 4, segment.y + gridSize-8, 4, 4);
                    } else if(dy > 0) {
                        ctx.fillRect(segment.x + 4, segment.y + gridSize-8, 4, 4);
                        ctx.fillRect(segment.x + gridSize-8, segment.y + gridSize-8, 4, 4);
                    } else {
                        ctx.fillRect(segment.x + 4, segment.y + 4, 4, 4);
                        ctx.fillRect(segment.x + gridSize-8, segment.y + 4, 4, 4);
                    }
                }
            });
            
            // Check collision with walls
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
            }
            
            // Check collision with self
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                }
            }
        }
        
        function gameOver() {
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = 'Your Score: ' + score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Handle keyboard controls
        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case 'ArrowUp':
                    if (dy === 0) {
                        dx = 0;
                        dy = -gridSize;
                    }
                    break;
                case 'ArrowDown':
                    if (dy === 0) {
                        dx = 0;
                        dy = gridSize;
                    }
                    break;
                case 'ArrowLeft':
                    if (dx === 0) {
                        dx = -gridSize;
                        dy = 0;
                    }
                    break;
                case 'ArrowRight':
                    if (dx === 0) {
                        dx = gridSize;
                        dy = 0;
                    }
                    break;
            }
            socket.emit('move', {dx: dx, dy: dy});
        });
        
        socket.on('move_response', (data) => {
            // Handle multiplayer updates if implemented
        });
    </script>
</body>
</html>
